# รันเทสต์อัตโนมัติทุกครั้งที่ push หรือเปิด pull request
name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env:
          CI: true
      # เช็กว่า build แบบเดียวกับ Vercel ผ่าน (CI=true ทำให้ ESLint warning นับเป็น error)
      # ถ้าพัง จะแสดงท้าย log เป็น annotation บนหน้า Actions
      - name: npm run build
        shell: bash
        env:
          CI: true
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=npm run build failed::${msg}"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./...
      - run: go test ./...
