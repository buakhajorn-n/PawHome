# รันเทสต์อัตโนมัติทุกครั้งที่ push หรือเปิด pull request
name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ยังไม่มี package-lock.json จึงใช้ npm install แทน npm ci
      # (เมื่อ commit lockfile แล้ว ค่อยเปลี่ยนกลับเป็น npm ci + cache: npm)
      - run: npm install --no-audit --no-fund
      # เก็บ lockfile ที่ได้ไว้ให้ดาวน์โหลดไป commit
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build   # เช็กว่า build แบบเดียวกับ Vercel ผ่าน
        env:
          CI: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./...
      - run: go test ./...
